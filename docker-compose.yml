services:
  nginx:
    container_name: nginx
    build: src/requirements/nginx
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wp-files:/var/www/html
    restart: always
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: src/requirements/wordpress
    env_file: src/.env
    volumes:
      - wp-files:/var/www/html
    restart: always
    networks:
      - inception

  mariadb:
    container_name: mariadb
    build: src/requirements/mariadb
    env_file: src/.env
    volumes:
      - db-data:/var/lib/mysql
    restart: always
    networks:
      - inception

volumes:
  wp-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/anakin/data/wordpress
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/anakin/data/mariadb

networks:
  inception:
    driver: bridge
