services:
  nginx:
    container_name: nginx
    build: src/requirements/nginx
    ports:
      - "80:80"
    depends_on:
      - wordpress
    volumes:
      - ./src/web:/var/www/html
  wordpress:
    container_name: wordpress
    build: src/requirements/wordpress
    volumes:
      - ./src/web:/var/www/html
  mariadb:
    container_name: mariadb
    build: src/requirements/mariadb
